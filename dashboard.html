<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard - HRD Admin</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Bootstrap CSS & Icons -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <!-- File Style Custom Utama -->
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="bg-body-tertiary">
    <!-- HEADER / NAVBAR -->
    <header class="header" id="mainHeader">
      <div class="div">
        <!-- Brand / Logo -->
        <div class="brand-container">
          <img class="gps-logo-img" src="images/logo.png" alt="Logo GPS" />
          <div class="brand-text">
            <div class="brand-title-top">PORTAL LAYANAN</div>
            <div class="brand-title-main">LOWONGAN KERJA</div>
          </div>
        </div>

        <!-- Menu Navigasi Kanan & Profil -->
        <div class="nav-right-container">
          <nav class="nav-menu">
            <a href="dashboard.html" class="text-wrapper-2 text-decoration-none"
              >Dashboard</a
            >
            <a
              href="kelola-lamaran.html"
              class="text-wrapper-2 text-decoration-none"
              >Lamaran</a
            >
            <a
              href="kelola-lowongan.html"
              class="text-wrapper-2 text-decoration-none"
              >Lowongan</a
            >
            <a
              href="kelola-jadwal.html"
              class="text-wrapper-2 text-decoration-none"
              >Jadwal Seleksi</a
            >
            <a
              href="kelola-karyawan.html"
              class="text-wrapper-2 text-decoration-none"
              >Karyawan Baru</a
            >
          </nav>
          <a href="akun.html" title="Akun Saya">
            <img
              class="akun border border-primary border-2 rounded-circle"
              src="images/akun.png"
              alt="Foto Profil"
            />
          </a>
        </div>
      </div>
    </header>

    <!-- MAIN CONTENT AREA DASHBOARD -->
    <div class="dashboard-hrd-admin">
      <main class="frame-2">
        <!-- Judul Halaman -->
        <div class="frame-3">
          <h1 class="text-wrapper-3">Dashboard</h1>
        </div>

        <!-- Kartu Ringkasan Statistik -->
        <div class="frame-4">
          <!-- Card 1 -->
          <div class="card p-3 border-0 rounded-4 text-white shadow-sm">
            <div class="judul">
              <span class="text-wrapper-4">Lowongan aktif</span>
              <span class="text-wrapper-5">12</span>
            </div>
          </div>

          <!-- Card 2 -->
          <div class="card p-3 border-0 rounded-4 text-white shadow-sm">
            <div class="frame-5">
              <span class="text-wrapper-4">Lowongan ditutup</span>
              <span class="text-wrapper-5">8</span>
            </div>
          </div>

          <!-- Card 3 -->
          <div class="card p-3 border-0 rounded-4 text-white shadow-sm">
            <div class="frame-5">
              <span class="text-wrapper-4">Menunggu review</span>
              <span class="text-wrapper-5">87</span>
            </div>
          </div>

          <!-- Card 4 -->
          <div class="card p-3 border-0 rounded-4 text-white shadow-sm">
            <div class="frame-5">
              <span class="text-wrapper-4">Total pelamar</span>
              <span class="text-wrapper-5">348</span>
            </div>
          </div>
        </div>

        <!-- Tabel Lowongan Aktif Ringkas -->
        <div class="tabel-container">
          <table class="lamaran-table mb-0">
            <thead>
              <tr>
                <th>Nama Lowongan</th>
                <th style="text-align: right; padding-right: 24px">Status</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td class="fw-medium">Marketing</td>
                <td style="text-align: right; padding-right: 24px">
                  <span
                    class="d-inline-flex align-items-center gap-2 fw-medium"
                    style="color: #111827"
                  >
                    <span
                      class="rounded-circle d-inline-block"
                      style="width: 8px; height: 8px; background-color: #34c759"
                    ></span>
                    Dibuka
                  </span>
                </td>
              </tr>
              <tr>
                <td class="fw-medium">Accounting</td>
                <td style="text-align: right; padding-right: 24px">
                  <span
                    class="d-inline-flex align-items-center gap-2 fw-medium"
                    style="color: #111827"
                  >
                    <span
                      class="rounded-circle d-inline-block"
                      style="width: 8px; height: 8px; background-color: #34c759"
                    ></span>
                    Dibuka
                  </span>
                </td>
              </tr>
              <tr>
                <td class="fw-medium">IT Support</td>
                <td style="text-align: right; padding-right: 24px">
                  <span
                    class="d-inline-flex align-items-center gap-2 fw-medium"
                    style="color: #111827"
                  >
                    <span
                      class="rounded-circle d-inline-block"
                      style="width: 8px; height: 8px; background-color: #ffcc00"
                    ></span>
                    Segera tutup
                  </span>
                </td>
              </tr>
              <tr>
                <td class="fw-medium">Finance</td>
                <td style="text-align: right; padding-right: 24px">
                  <span
                    class="d-inline-flex align-items-center gap-2 fw-medium"
                    style="color: #111827"
                  >
                    <span
                      class="rounded-circle d-inline-block"
                      style="width: 8px; height: 8px; background-color: #ff3b30"
                    ></span>
                    Tutup
                  </span>
                </td>
              </tr>
              <tr>
                <td class="fw-medium">Pajak</td>
                <td style="text-align: right; padding-right: 24px">
                  <span
                    class="d-inline-flex align-items-center gap-2 fw-medium"
                    style="color: #111827"
                  >
                    <span
                      class="rounded-circle d-inline-block"
                      style="width: 8px; height: 8px; background-color: #34c759"
                    ></span>
                    Dibuka
                  </span>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </main>
    </div>

    <!-- Bootstrap JS & Custom Script -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
  </body>
</html>
